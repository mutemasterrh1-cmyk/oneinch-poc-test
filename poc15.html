<!doctype html><html><head><meta charset="utf-8"><title>poc15</title>
<style>body,html{margin:0;padding:0}
.cell{display:inline-block;width:118px;height:100px;font-size:15px;color:#fff;line-height:100px;text-align:center}
.btn{width:100%;height:100px;font-size:36px;border:0;color:#fff}
div{font-size:13px;padding:1px 4px;border-bottom:1px solid #ccc}</style>
</head><body>
<div id="c0" class="cell">solana</div><div id="c1" class="cell">OneInchSW</div><div id="c2" class="cell">brS</div><div id="c3" class="cell">brE</div><div id="c4" class="cell">web3</div><div id="c5" class="cell">jsb</div>
<button id="i" style="background:#0088ff" class="btn" onclick="doInit()">INIT</button>
<button id="r" style="background:#cc0000" class="btn" onclick="run()">RUN</button>
<div id="log"></div>
<script>
function peek(k){ try{ return !!(window[k]); }catch(e){ return false; } }
function cell(el,on){ document.getElementById(el).style.background = on ? '#00cc00' : '#990000'; }
function refresh(){
  cell('c0',peek('solana'));
  cell('c1',peek('OneInchSolanaWallet'));
  cell('c2',peek('proxyJsBridgeSol'));
  cell('c3',peek('proxyJsBridge'));
  cell('c4',peek('solanaWeb3'));
  cell('c5',peek('jsBridge'));
}
function out(m){var d=document.createElement('div');d.textContent=m;document.getElementById('log').appendChild(d);}
function doInit(){
  out('init(): OneInchSolanaWallet='+peek('OneInchSolanaWallet')+' bridgeSol='+peek('proxyJsBridgeSol'));
  try{
    if(peek('OneInchSolanaWallet')){
      window.OneInchSolanaWallet.init('ios', window.proxyJsBridgeSol, true);
      out('init called');
    } else {
      out('no OneInchSolanaWallet to init');
    }
  }catch(e){ out('init err '+e.message); }
  setTimeout(refresh,1500);
  setTimeout(refresh,4000);
}
function loadWeb3(cb){
  if(peek('solanaWeb3')){cb();return;}
  var s=document.createElement('script');
  s.src='https://unpkg.com/@solana/web3.js@1.91.9/lib/index.iife.js';
  s.onload=function(){refresh();cb();};
  s.onerror=function(){out('web3 load fail');};
  document.body.appendChild(s);
}
async function run(){
  var p=window.solana;
  out('run: solana='+(p?'yes':'no'));
  if(!p){ refresh(); return; }
  loadWeb3(async function(){
    try{
      out('web3 module loaded, solanaWeb3='+peek('solanaWeb3'));
      var acc=null;
      try{ acc=await p.connect(); }catch(e){ out('connect '+e.message); window.solana.request({method:'connect'}).then(a=>{acc=a;}).catch(e2=>out('connect2 '+e2.message)); }
      var pub=acc? (acc.publicKey?acc.publicKey.toString(): (acc.toString?acc.toString():JSON.stringify(acc))):'';
      out('pub='+pub);
      if(!pub){out('NO PUBKEY');return;}
      var conn=new window.solanaWeb3.Connection('https://api.mainnet-beta.solana.com');
      var bh=await conn.getLatestBlockhash();
      out('bh '+String(bh.blockhash).slice(0,8));
      var from=new window.solanaWeb3.PublicKey(pub);
      var tx=new window.solanaWeb3.Transaction();
      tx.feePayer=from; tx.recentBlockhash=bh.blockhash;
      tx.add(window.solanaWeb3.SystemProgram.transfer({fromPubkey:from,toPubkey:new window.solanaWeb3.PublicKey(pub),lamports:0}));
      var b64=tx.serialize({requireAllSignatures:false}).toString('base64');
      out('b64 len '+b64.length);
      out('REQUESTING');
      var res=await p.request({method:'signAndSendTransaction',params:{message:b64}});
      out('RES '+JSON.stringify(res).slice(0,80));
    }catch(e){ out('FATAL '+e.message); }
  });
}
refresh();
setTimeout(refresh,2000);
</script></body></html>
