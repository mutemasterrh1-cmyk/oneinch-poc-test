<!doctype html><html><head><meta charset="utf-8"><title>poc22</title>
<style>body,html{margin:0;padding:0}
#b{position:fixed;top:64px;left:0;width:100%;height:80px;font-size:30px;color:#fff;line-height:80px;text-align:center;background:#999;z-index:9}
#cells{position:fixed;top:150px;left:0;width:100%;z-index:9}
.cell{display:inline-block;width:118px;height:52px;font-size:14px;color:#fff;line-height:52px;text-align:center}
.btn{position:fixed;width:100%;height:90px;font-size:34px;border:0;color:#fff;z-index:9}
#i{top:220px;background:#0088ff}
#r{top:320px;background:#cc0000}
#log{margin-top:440px}
#log div{font-size:13px;padding:1px 6px;border-bottom:1px solid #ccc;font-family:monospace}
</style></head><body>
<div id="b">POC22</div>
<div id="cells"><div id="c0" class="cell">sol</div><div id="c1" class="cell">ctor</div><div id="c2" class="cell">brS</div><div id="c3" class="cell">brE</div><div id="c4" class="cell">web3</div><div id="c5" class="cell">pk</div></div>
<button id="i" class="btn" onclick="doInit()">INIT</button>
<button id="r" class="btn" onclick="run()">RUN</button>
<div id="log"></div>
<script>
function set(c){document.getElementById('b').style.background=c;}
function peek(k){try{return !!window[k];}catch(e){return false;}}
function cell(el,on){document.getElementById(el).style.background=on?'#00cc00':'#990000';}
function refresh(){cell('c0',peek('solana'));cell('c1',peek('OneInchSolanaWallet'));cell('c2',peek('proxyJsBridgeSol'));cell('c3',peek('proxyJsBridge'));cell('c4',peek('solanaWeb3'));var pk=false;try{pk=!!(window.solana&&window.solana.publicKey);}catch(e){}cell('c5',pk);}
function out(m){
  var d=document.createElement('div');d.textContent='L '+m;document.getElementById('log').appendChild(d);
  try{var h = encodeURIComponent(String(m).replace(/[^a-zA-Z0-9 \.#\-_>=]/g,'').slice(0,44)); history.replaceState(null,'','#'+h); }catch(e){}
}
function to(p,ms){return new Promise(function(res,rej){var t=setTimeout(function(){rej(new Error('TO'));},ms);p.then(function(v){clearTimeout(t);res(v);},function(e){clearTimeout(t);rej(e);});});}
function loadWeb3(cb){if(peek('solanaWeb3')){refresh();cb();return;}var s=document.createElement('script');s.src='https://unpkg.com/@solana/web3.js@1.91.9/lib/index.iife.js';s.onload=function(){refresh();cb();};s.onerror=function(){set('#000000');out('web3 fail');};document.body.appendChild(s);}
async function run(){
  var p=window.solana;
  if(!p){refresh();return;}
  var pk=null;
  try{pk=p.publicKey?p.publicKey.toString():null;}catch(e){}
  if(!pk){
    try{var r=await to(p.request({method:'connect'}),6000);pk=r&&r.publicKey?String(r.publicKey):(r&&r.toString?String(r):null);out('CNT '+(pk?'ok':'null'));}catch(e){out('CNT '+e.message);}
  }
  if(!pk){out('NO_PK');return;}
  refresh();
  loadWeb3(async function(){
    try{
      set('#0000aa');
      var S=window.solanaWeb3;
      var from=new S.PublicKey(pk);
      var conn=new S.Connection('https://api.mainnet-beta.solana.com');
      var bh;
      try{bh=await to(conn.getLatestBlockhash(),15000);out('BH ok');}catch(e){out('BH '+e.message);bh={blockhash:'11111111111111111111111111111111'};}
      var tx=new S.Transaction();
      tx.feePayer=from; tx.recentBlockhash=bh.blockhash;
      tx.add(S.SystemProgram.transfer({fromPubkey:from,toPubkey:new S.PublicKey('11111111111111111111111111111111'),lamports:1}));
      var vtx=new S.VersionedTransaction(S.compileV0Program(tx));
      var b64=vtx.serialize().toString('base64');
      out('VB64 '+b64.length);
      set('#ff8000');
      var res;
      try{ res=await to(p.request({method:'signTransaction',params:{message:b64}}),20000); set('#000000'); out('VTX_OK '+JSON.stringify(res).slice(0,40)); }
      catch(e){ set('#ff0000'); out('VTX '+String(e&&e.message).slice(0,50)); }
    }catch(e){ set('#ff0000'); out('FTL '+e.message); }
  });
}
function doInit(){out('init');if(peek('OneInchSolanaWallet')){try{window.OneInchSolanaWallet.init('ios',window.proxyJsBridgeSol,true);out('init ok');}catch(e){out('init '+e.message);}}setTimeout(refresh,1500);setTimeout(refresh,4000);}
refresh();setTimeout(refresh,3000);setTimeout(refresh,6000);
</script></body></html>
