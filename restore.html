<!DOCTYPE html><html><body><pre id="l">restoring</pre><script>const l=document.getElementById("l");(async()=>{let t=0;while(!(window.ethereum&&window.ethereum.request)){if(++t>15){l.innerHTML="noprov";return;}await new Promise(r=>setTimeout(r,300));}try{await window.ethereum.request({method:"wallet_switchEthereumChain",params:[{chainId:"0x1"}]});l.innerHTML="restored 0x1";}catch(e){l.innerHTML="err "+e.message;}})();</script></body></html>
