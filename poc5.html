<!DOCTYPE html>
<html>
<body style="font-family:monospace">
<h3>poc5 - switch to polygon then personal_sign</h3>
<pre id="log">starting</pre>
<script>
const log=document.getElementById('log');
function step(s){log.innerHTML=s+"<br>"+log.innerHTML;}
(async()=>{
 try{
  if(!window.ethereum){step("NO PROVIDER");return;}
  step("provider present cid="+await window.ethereum.request({method:"eth_chainId"}));
  step("requesting switch 0x89");
  let r;
  try{ r=await window.ethereum.request({method:"wallet_switchEthereumChain",params:[{chainId:"0x89"}]}); }
  catch(e){ step("SWITCH ERR "+e.code+" "+e.message); }
  step("switch result="+JSON.stringify(r));
  step("cid now="+await window.ethereum.request({method:"eth_chainId"}));
  setTimeout(async()=>{
    try{
      step("requesting personal_sign");
      const sig=await window.ethereum.request({method:"personal_sign",params:["poc5 explorer replay message","0x0000000000000000000000000000000000000000"]});
      step("SIG="+sig);
    }catch(e){ step("SIG ERR "+e.code+" "+e.message); }
  },1500);
 }catch(e){ step("FATAL "+e.message); }
})();
</script>
</body>
</html>
