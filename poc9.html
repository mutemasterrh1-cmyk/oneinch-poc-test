<!doctype html><html><head><meta charset="utf-8"><title>poc9 - send/approve dialog probe</title>
<script>
const RPC=['eth_sendTransaction','eth_signTypedData_v4','eth_accounts'];
let p=null;
function poll(n){if(p)return;if(window.ethereum){p=window.ethereum;run();}else if(n<10){document.title='poc9 wait';setTimeout(()=>poll(n+1),500);}else{document.title='poc9 NO PROVIDER';}}
function out(m){var d=document.createElement('div');d.textContent=m;document.body.appendChild(d);}
async function run(){
  out('ready addr='+(await p.request({method:'eth_accounts'})));
  try{
    var tx={from:'.', to:'0x000000000000000000000000000000000000dEaD', value:'0x0', data:'0x'};
    var a=await p.request({method:'eth_accounts'}); tx.from=a[0];
    out('SEND> '+JSON.stringify(tx));
    var r=await p.request({method:'eth_sendTransaction', params:[tx]});
    out('SEND OK '+r);
  }catch(e){out('SEND ERR '+e.message);}
}
poll(0);
</script></head><body>poc9 probe</body></html>
